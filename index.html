function noteAt(f, d, type, v, t, f2) {

  if (m) { const len = (() => { let n = 1; while (n < 4 && !s.mel[(i + n) % s.mel.length]) n++; return n; })() * st;
    softNote(mtof(m), len * 0.9, s.muzak ? 'sine' : 'triangle', s.rain ? 0.05 : 0.06, tt, { att: 0.015, sus: 0.45, rel: 0.4, cut: s.rain || s.muzak ? 1400 : 2200, vib: len > st * 2 || s.muzak });
    softNote(mtof(m + 12), len * 0.5, 'sine', 0.012, tt, { att: 0.01, sus: 0.2, rel: 0.2, cut: 3000 }); }   // 電鋼琴的泛音
  if (k === 0) ch.forEach((n, j) => softNote(mtof(n), st * 7.6, 'sine', 0.018, tt + j * 0.012, { att: 0.25, sus: 0.8, rel: 0.6, cut: 1200 }));   // 和弦墊
  if ([2, 5].includes(k)) ch.slice(1).forEach(n => softNote(mtof(n), st * 0.9, 'triangle', 0.012, tt, { att: 0.006, sus: 0.3, rel: 0.15, cut: 1600 }));   // 吉他刷弦（輕輕的）
  const bn = k === 0 ? root : k === 3 || k === 4 ? root + 7 : k === 7 && bar % 2 ? root + 5 : 0;
  if (bn) softNote(mtof(bn), st * (k === 0 ? 2.6 : 1.1), 'sine', 0.11, tt, { att: 0.01, sus: 0.5, rel: 0.2, cut: 600 });
  if (!s.rain || k % 2 === 0) softHit(tt, k % 2 ? 'shk' : 'shk2');
  if (k === 0 || k === 4) softHit(t, 'kick');
  if ([0, 3, 6].includes(i % 16) || [10, 12].includes(i % 16)) softHit(tt, 'wood');
  if (k === 0 && Math.random() < 0.18 && !s.rain && !s.muzak) birdTweet(t + st * (2 + Math.random() * 4));
}

  if (G.state === 'skins') { skinKey(e); return; }
  if (G.state === 'cards') { if (['Escape', 'Enter', 'Space'].includes(e.code)) { e.preventDefault(); goTitle(); } return; }
  if (G.state === 'play' && !G.paused && (G.stage || G.bsod) && !['KeyM', 'KeyP', 'Escape'].includes(e.code)) {
    e.preventDefault();

    return;
  }
  if (G.state === 'play' && (e.code === 'KeyQ' || (KEYMAP[e.code] === 'down' && !e.repeat && G.ads.length))) closeAd(null, true);
  if (G.state === 'play' && e.code === 'KeyQ') return;

  if (G.state === 'title' && e.code === 'KeyB') { openBubble('title'); return; }

  if (k || e.code === 'Enter') e.preventDefault();

  }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'KeyX' || e.code === 'KeyJ') { e.preventDefault(); if (!e.repeat) tryFlip(); return; }

const isTouch = ('ontouchstart' in window) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
if (isTouch) document.body.classList.add('touch');
document.querySelectorAll('.tbtn').forEach(b => {
  const k = b.dataset.k;
  const on = e => {
    e.preventDefault(); initAudio(); b.classList.add('on');
    if ((G.bro || G.cine) && G.state === 'play' && !G.paused) { G.mash = true; return; }
    if (G.state === 'play' && !G.paused && G.bsod) { bsodPress(); return; }
    if (G.state === 'play' && !G.paused && G.stage) { if (k !== 'flip') stageInput(k); return; }
    if (k === 'flip') { tryFlip(); return; }
    if (G.state === 'play' && k === 'down' && G.ads.length) closeAd(null, true);
    if (k === 'down') G.downTap = 8;
    if (G.state !== 'play' && k === 'jump') { confirmAct(); keys.jump = true; return; }
    if (k === 'jump' && !keys.jump) jumpPressed = true;
    keys[k] = true;
  };
  const off = e => { e.preventDefault(); if (k !== 'flip') keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
function canvasPos(e) { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
let ptrDown = false;
cvs.addEventListener('pointerdown', e => {
  initAudio();
  const p = canvasPos(e);
  for (const u of G.ui) if (p.x >= u.x && p.x <= u.x + u.w && p.y >= u.y && p.y <= u.y + u.h) { u.fn(); return; }
  if ((G.bro || G.cine) && G.state === 'play' && !G.paused) { G.mash = true; return; }
  if (G.state === 'bubble') { ptrDown = true; popAt(p.x, p.y); try { cvs.setPointerCapture(e.pointerId); } catch (_) {} return; }
  if (G.state === 'golf') { golfPress(); return; }
  if (G.state === 'stare') { if (G.st && G.st.phase === 'play') { stHold(true); ptrDown = true; } return; }
  if (G.state === 'phish') { phPointer('down', p); ptrDown = true; try { cvs.setPointerCapture(e.pointerId); } catch (_) {} return; }
  if (G.state === 'shop' || G.state === 'calendar' || G.state === 'cards' || G.state === 'skins' || G.state === 'mengpo' || G.state === 'elevator' || G.state === 'hub') return;
  if (G.state === 'play' && G.bsod && !G.paused) { bsodPress(); return; }
  if (G.state !== 'play') confirmAct(); else if (G.paused) togglePause();
});
cvs.addEventListener('pointermove', e => { if (ptrDown && G.state === 'bubble') { const p = canvasPos(e); popAt(p.x, p.y); } if (ptrDown && G.state === 'phish') phPointer('move', canvasPos(e)); });
function ptrRelease() { if (ptrDown && G.state === 'stare') stHold(false); if (ptrDown && G.state === 'phish') phPointer('up'); ptrDown = false; }
window.addEventListener('pointerup', ptrRelease); window.addEventListener('pointercancel', ptrRelease);

function build(def) {
  const w = def.w, h = 17, tiles = new Uint8Array(w * h), content = {};
  const B = {
    ents: [], events: [],
    set(x, y, t) { if (x >= 0 && x < w && y >= 0 && y < h) tiles[y * w + x] = t; },
    ground(a, b) { for (let x = a; x <= b; x++) { B.set(x, 15, 1); B.set(x, 16, 1); } },
    row(a, b, y, t) { for (let x = a; x <= b; x++) B.set(x, y, t); },
    col(x, y1, y2, t) { for (let y = y1; y <= y2; y++) B.set(x, y, t); },
    q(x, y, c) { B.set(x, y, 3); content[x + ',' + y] = c || 'g'; },
    hid(x, y, c) { B.set(x, y, 9); content[x + ',' + y] = c || 'g'; },
    grapes(a, b, y) { for (let x = a; x <= b; x++) B.e('grape', x, y); },
    tip(x, text) { B.e('tip', x, 14, { text }); },
    o(kind, ...xs) { for (const x of xs) B.e('obj', x, 14, { kind }); },
    stairsUp(x, n) { for (let i = 0; i < n; i++) B.col(x + i, 14 - i, 14, 1); },
    stairsDown(x, n) { for (let i = 0; i < n; i++) B.col(x + i, 14 - (n - 1 - i), 14, 1); },
    e(type, tx, ty, opt) { B.ents.push(Object.assign({ type, tx, ty }, opt || {})); },
    ev(x, kind, text) { B.events.push({ x, kind, text, done: false }); },
    rooms: [],
    room(a, b) { B.ground(a, b); B.col(a - 1, 0, 16, 1); B.col(b + 1, 0, 16, 1); B.rooms.push([a, b]); },   // 門後的小房間（放在地圖最右邊）
  };
  def.build(B);
  const tick = def.deadline && def.par ? def.par * 60 / (def.deadline - def.clock) : 8;   // 幾幀走一分鐘
  const roomX = B.rooms.length ? Math.min(...B.rooms.map(r => r[0])) - 1 : null;
  return Object.assign({}, def, { h, tiles, content, ents: B.ents, events: B.events, tick, sub: def.mission, rooms: B.rooms, roomX });
}

function tileAt(tx, ty) {
  if (tx < 0 || tx >= LV.w) return 1;
  if (ty < 0 || ty >= LV.h) return 0;
  return LV.tiles[ty * LV.w + tx];
}
function setTile(tx, ty, v) { if (tx >= 0 && tx < LV.w && ty >= 0 && ty < LV.h) LV.tiles[ty * LV.w + tx] = v; }
const isSolid = t => t === 1 || t === 2 || t === 3 || t === 4 || t === 8;

// 軸分離的 AABB 圖塊碰撞
function moveBody(b, oneWay) {
  b.hitWall = 0; b.headHit = null;
  b.x += b.vx;
  const top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - 1) / T);
  if (b.vx > 0) {
    const tx = Math.floor((b.x + b.w - 0.001) / T);
    for (let ty = top; ty <= bot; ty++) if (isSolid(tileAt(tx, ty))) { b.x = tx * T - b.w; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x / T);
    for (let ty = top; ty <= bot; ty++) if (isSolid(tileAt(tx, ty))) { b.x = (tx + 1) * T; b.vx = 0; b.hitWall = -1; break; }
  }
  const prevBottom = b.y + b.h;
  b.y += b.vy; b.onGround = false;
  const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - 0.001) / T);
  if (b.vy >= 0) {
    const ty = Math.floor((b.y + b.h) / T);
    for (let tx = l; tx <= r; tx++) {
      const t = tileAt(tx, ty);
      if (isSolid(t) || (oneWay && t === 7 && prevBottom <= ty * T + 0.5)) { b.y = ty * T - b.h; b.vy = 0; b.onGround = true; break; }
    }
  } else {
    const ty = Math.floor(b.y / T);
    let best = null, bd = 1e9;
    for (let tx = l; tx <= r; tx++) if (isSolid(tileAt(tx, ty)) || (b === P && tileAt(tx, ty) === 9 && b.y - b.vy >= (ty + 1) * T - 0.5)) {
      const d = Math.abs((tx + 0.5) * T - (b.x + b.w / 2));
      if (d < bd) { bd = d; best = { x: tx, y: ty }; }
    }
    if (best) { b.y = (best.y + 1) * T; b.vy = 0; b.headHit = best; }
  }
}

const BUB = { cols: 12, rows: 5, size: 72, x0: 48, y0: 96 };
function newSheet() {

  if (c.label) pops.push({ x: cx, y: cy - 30, text: `「${c.label}」被戳爆！`, color: '#ffeb3b', size: 15, t: 60 });
  else if (b.pops % 9 === 0) pops.push({ x: cx, y: cy - 30, text: pick(['啵！', '好爽', '紓壓 +1', '再一個', '啵啵啵', '療癒']), color: '#fff', size: 14, t: 50 });

}
function popAt(x, y) {

    case 'dead': updateDead(); break;
    case 'intro': updateFx(); break;
    case 'clear': case 'over': updateFx(); break;

    case 'bubble': updateBubble(); break;
    case 'shop': if (G.shop.shake > 0) G.shop.shake--; if (G.shop.flash > 0) G.shop.flash--; break;
    case 'ending': updateFx(); break;

    case 'dayclear': updateFx(); break;
    case 'parade': updateFx(); if (G.stateT % 8 === 0) SFX.pop(); break;
    case 'mengpo': updateMengpo(); break;
    case 'golf': updateGolf(); break;
    case 'elevator': updateElevator(); break;
    case 'stare': updateStare(); break;
    case 'phish': updatePhish(); break;
  }
  if (G.bro || G.cine || G.state === 'mengpo' || (G.state === 'golf' && G.golf && ['holed', 'done'].includes(G.golf.phase))) {}
  else if (G.achShow) { if (--G.achShow.t <= 0) G.achShow = null; }
  else if (G.achQ.length) { G.achShow = G.achQ.shift(); if (G.achQ.length) G.achShow.t = 120; SFX.ach(); }

  if (G.cine) { updateCine(); return; }                   // 過場：Boss 慢動作／下班打卡

  if (G.rtMsg && FC >= G.rtT && !G.toast) { toast(G.rtMsg, 300); G.rtMsg = null; SFX.ding(); }

  const D = DAYS[n - 1], r = mulberry(n * 31 + 7), pool = ['desks', 'pit', 'stairs', 'boxes', 'towers', ...(D.theme === 4 ? ['spot'] : [])];
  const list = D.chunks.slice(), extra = D.boss ? 1 : 2, ri = list.indexOf('rest') >= 0 ? list.indexOf('rest') : list.indexOf('rest:nap');
  for (let i = 0; i < extra; i++) { const c = pool[Math.floor(r() * pool.length)]; if (i === 0) list.splice(ri, 0, c); else list.splice(list.length - 1, 0, c); }
  return list;
}

function dayDone(n) { return !!META.days[n]; }
function dayOpen(n) {
  if (n === 1 || META.dev) return true;

  const set = new Set(META.log); let s = 0, off = set.has(todayStr()) ? 0 : -1;

}

};
function blip(voice) { const v = VOICES[voice] || VOICES.grape; tone(rand(v[1], v[2]), 0.05, v[0], v[3]); }

// ---------- 現實時間彩蛋＋真實節日裝飾 ----------
// 預覽用：網址後面加 ?date=2026-12-25&hour=1 可以假裝是那一天、那個時間
const RT_Q = (() => { try { return new URLSearchParams(location.search); } catch (_) { return null; } })();
function realNow() {
  const d = new Date();
  try {
    if (RT_Q && RT_Q.get('date')) { const [y, m, dd] = RT_Q.get('date').split('-').map(Number); d.setFullYear(y, m - 1, dd); }
    if (RT_Q && RT_Q.get('hour') != null) d.setHours(+RT_Q.get('hour'), 30);
  } catch (_) {}
  if (G.fakeNow) return new Date(G.fakeNow);

}

function drawCardsPage() {

function skinState(s) {
  if (META.skins.includes(s.id)) return META.skin === s.id ? 'on' : 'own';
  return s.stamps || s.golf ? 'lock' : 'buy';
}
function skinPick(i) {
  const s = SKINS[i], st = skinState(s);
  if (st === 'own' || st === 'on') { META.skin = s.id; saveMeta(); SFX.coin(); G.skinMsg = `${s.icon} 換上了：${s.name}`; }
  else if (st === 'buy') {
    if (META.bank >= s.price) { META.bank -= s.price; META.skins.push(s.id); META.skin = s.id; saveMeta(); SFX.cash(); G.skinMsg = `🛍️ 買下 ${s.name}！（存摺剩 ${META.bank}）`; }
    else { SFX.nope(); G.skinMsg = `🍇 存摺不夠（還差 ${s.price - META.bank}）：每日打卡關撿到的葡萄會存進來`; }
  } else if (s.golf) { SFX.nope(); G.skinMsg = '⛳ 週末陪老闆打高爾夫，打出「完美讓桿」就送你'; }
  else { SFX.nope(); G.skinMsg = `📅 出勤卡蓋滿 ${s.stamps} 格就送你（目前 ${stampCount()} 格）`; }
}
function drawSkinsPage() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4a148c'); g.addColorStop(1, '#1a0b33'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = st === 'on' ? 'rgba(255,213,79,.25)' : 'rgba(255,255,255,.08)'; rr(x, y, 150, 186, 12); ctx.fill();
    ctx.strokeStyle = st === 'on' ? '#ffd54f' : sel ? '#fff' : 'rgba(255,255,255,.2)'; ctx.lineWidth = st === 'on' || sel ? 3 : 1.5; ctx.stroke();
    ctx.save(); if (st === 'lock') ctx.globalAlpha = 0.35;
    drawHero(x + 75, y + 120, 2.2, 1, 0, false, { skin: s.id, happy: st === 'on' });
    ctx.restore();
    txtFit(s.icon + ' ' + s.name, x + 75, y + 150, 140, 15, '#fff', 'center');
    txt(st === 'on' ? '✔ 穿著中' : st === 'own' ? '點一下換上' : st === 'buy' ? `🍇 ${s.price}` : s.golf ? '🔒 完美讓桿' : `🔒 出勤 ${s.stamps} 天`, x + 75, y + 174, 13,
        st === 'on' ? '#ffd54f' : st === 'buy' ? '#b9f6ca' : '#e1bee7', 'center');
    if (!G.capture) G.ui.push({ x, y, w: 150, h: 186, fn: () => { G.skinSel = i; skinPick(i); } });
  });
  if (G.skinMsg) txtFit(G.skinMsg, W / 2, 482, W - 340, 15, '#fff59d', 'center');
  drawBtn(24, H - 50, 150, 36, '◀ 回標題', goTitle, '#6a1b9a');
  if (META.dev) drawBtn(W - 224, H - 50, 200, 36, '🔒 關閉試玩模式', () => { META.dev = false; saveMeta(); G.skinMsg = '已關閉試玩模式'; }, '#455a64');
}
function skinKey(e) {
  const i = G.skinSel || 0;
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': G.skinSel = Math.max(0, i - 1); break;
    case 'ArrowRight': case 'KeyD': G.skinSel = Math.min(SKINS.length - 1, i + 1); break;
    case 'ArrowUp': case 'KeyW': G.skinSel = Math.max(0, i - 6); break;
    case 'ArrowDown': case 'KeyS': G.skinSel = Math.min(SKINS.length - 1, i + 6); break;
    case 'Enter': case 'Space': case 'KeyZ': case 'KeyK': if (!e.repeat) skinPick(i); break;
    case 'Escape': goTitle(); break;
    default: return;
  }
  e.preventDefault();
}

// ---------- 每日場景的天氣、橫幅 ----------
function drawDayBanner() {
  if (!LV || !LV.banner) return;
  const off = cam.x * 0.3, P0 = 1100;
  for (let k = Math.floor(off / P0) - 1; k < Math.floor(off / P0) + 2; k++) {
    const x = k * P0 - off + 480;
    txt(LV.banner, x, 250, 34, (SKIES[LV.sky] || {}).dark ? 'rgba(255,255,255,.12)' : 'rgba(60,30,80,.12)', 'center');
  }
}
function drawWeatherBack() {
  if (!LV || !LV.wx) return;
  const wx = LV.wx;
  if (wx === 'stars' || wx === 'lantern' || wx === 'ghost' || LV.sky === 'moon') {
    for (let i = 0; i < 40; i++) { const x = (hsh(i * 31) % W), y = hsh(i * 17) % 200; ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * Math.abs(Math.sin(FC * 0.03 + i))})`; ctx.fillRect(x, y, 2, 2); }
  }
  if (LV.sky === 'moon') { ctx.fillStyle = '#fff3c4'; circ(780 - cam.x * 0.02, 90, 42); ctx.fill(); ctx.fillStyle = 'rgba(255,243,196,.2)'; circ(780 - cam.x * 0.02, 90, 60); ctx.fill(); }
  if (wx === 'lantern') for (let i = 0; i < 7; i++) {
    const x = ((i * 157 - cam.x * 0.2) % (W + 100) + W + 100) % (W + 100) - 50, y = 60 + (hsh(i * 9) % 120) + Math.sin(FC * 0.02 + i) * 8;
    ctx.fillStyle = '#ef5350'; ell(x, y, 12, 15); ctx.fill(); ctx.fillStyle = '#ffeb3b'; ctx.fillRect(x - 6, y - 17, 12, 3); ctx.fillRect(x - 6, y + 14, 12, 3);
  }
  if (wx === 'fireworks') for (let i = 0; i < 3; i++) {
    const ph = (FC + i * 53) % 120, cx = 160 + i * 300 + (hsh(Math.floor((FC + i * 53) / 120) * 7 + i) % 140), cy = 90 + (i % 2) * 40;
    if (ph < 70) for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2, rr2 = ph * 1.2; ctx.fillStyle = ['#ffd54f', '#ff8a80', '#81d4fa'][i]; ctx.globalAlpha = 1 - ph / 70; circ(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2, 3); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}
function drawWeatherFront() {
  if (!LV || !LV.wx) return;
  const wx = LV.wx, n = wx === 'storm' ? 90 : 46;
  for (let i = 0; i < n; i++) {
    const h1 = hsh(i * 97 + 5), h2 = hsh(i * 61 + 11);
    switch (wx) {
      case 'rain': case 'storm': {
        const sp = wx === 'storm' ? 16 : 11, x = ((h1 % (W + 200)) - (FC * (wx === 'storm' ? 5 : 1.5)) % (W + 200) + W + 200) % (W + 200) - 100, y = ((h2 % H) + FC * sp) % (H + 40) - 20;
        ctx.strokeStyle = 'rgba(200,220,255,.45)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - (wx === 'storm' ? 8 : 3), y + 14); ctx.stroke(); break;
      }
      case 'petals': case 'leaves': case 'confetti': case 'paper': case 'money': case 'ghost': case 'bubbles': {
        const sp = wx === 'bubbles' ? -0.6 : wx === 'ghost' ? 0.3 : 0.9 + (h1 % 10) / 10;
        const x = ((h1 % W) + Math.sin(FC * 0.02 + i) * 30 - cam.x * 0.1 % W + W) % W, y = (((h2 % H) + FC * sp) % (H + 40) + H + 40) % (H + 40) - 20;
        ctx.save(); ctx.translate(x, y); ctx.rotate(FC * 0.03 + i);
        if (wx === 'petals') { ctx.fillStyle = 'rgba(248,187,208,.85)'; ell(0, 0, 5, 3); ctx.fill(); }
        else if (wx === 'leaves') { ctx.fillStyle = ['#ef6c00', '#fbc02d', '#8d6e63'][i % 3]; ell(0, 0, 6, 3); ctx.fill(); }
        else if (wx === 'confetti') { ctx.fillStyle = ['#ffd54f', '#b388ff', '#81d4fa', '#ff8a80'][i % 4]; ctx.fillRect(-3, -2, 6, 4); }
        else if (wx === 'paper') { if (i % 2) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(-6, -8, 12, 16); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-4, -4, 8, 1.5); ctx.fillRect(-4, 0, 8, 1.5); } }
        else if (wx === 'money') { if (i % 2) { ctx.fillStyle = 'rgba(129,199,132,.9)'; ctx.fillRect(-9, -5, 18, 10); txt('$', 0, 4, 9, '#1b5e20', 'center'); } }
        else if (wx === 'ghost') { if (i % 6 === 0) { ctx.rotate(-FC * 0.03 - i); ctx.globalAlpha = 0.25; txt('👻', 0, 0, 22, '#fff', 'center'); } }
        else if (wx === 'bubbles') { if (i % 2) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; circ(0, 0, 6 + (i % 4) * 2); ctx.stroke(); } }

}

// ---------- 主迴圈（固定 60 步/秒） ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
